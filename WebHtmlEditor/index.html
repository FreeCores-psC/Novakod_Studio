<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local HTML Documentation Editor</title>

  <script src="tinymce/tinymce.min.js"></script>
  <script src="prism/prism.js"></script>
  <link rel="stylesheet" href="prism/prism.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
    }
    
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #ffffff;
      border-bottom: 1px solid #d0d0d0;
    }

    button,
    input[type="file"] {
      font-size: 14px;
    }

    button {
      padding: 7px 12px;
      border: 1px solid #bdbdbd;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #f0f0f0;
    }

    .status {
      margin-left: auto;
      font-size: 13px;
      color: #555;
      white-space: nowrap;
    }

    .editor-wrap {
      padding: 12px;
    }

    .note {
      padding: 0 12px 12px 12px;
      font-size: 13px;
      color: #666;
    }

    pre[class*="language-"] {
      line-height: 1.4;
    }                           
        
    pre[class*="language-"],
    code[class*="language-"] {
      font-family: "Cascadia Mono", Cascadia, Consolas, monospace !important;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <input type="file" id="fileInput" accept=".html,.htm,text/html" />
    <button id="saveBtn" type="button">Save HTML</button>
    <button id="newBtn" type="button">New Document</button>
    <span class="status" id="status">Ready</span>
  </div>

  <div class="editor-wrap" id="editor-wrap-id">
    <textarea id="editor"></textarea>
  </div>

  <div class="note">
    Open a local HTML file, edit it visually like a word processor, insert embedded images, and use code samples for C++, psC, VHDL, and Verilog.
  </div>

  <script>
    let editorReadyResolve;
    let hasLoadedUserFile = false;    
    
    const editorReady = new Promise((resolve) => {
      editorReadyResolve = resolve;
    });

    function makeEditorCss(css) {
      return css.replace(/(^|})\s*([^{}]+)\s*\{/g, function (match, prefix, selectorGroup) {
        const scopedSelectors = selectorGroup
          .split(",")
          .map(function (selector) {
            selector = selector.trim();
            if (!selector) return "";
    
            if (selector.startsWith("body")) {
              return selector.replace(/^body\b/, "body.mce-content-body");
            }
    
            return "body.mce-content-body " + selector;
          })
          .filter(Boolean)
          .join(",\n");
    
        return prefix + "\n" + scopedSelectors + " {";
      });
    }

    function setStatus(text) {

    function splitHtmlDocument(fullHtml) {
      const bodyMatch = fullHtml.match(/<body\b[^>]*>([\s\S]*?)<\/body>/i);

      if (bodyMatch) {
        const bodyInner = bodyMatch[1];
        const fullMatch = bodyMatch[0];
        const bodyStartIndex = bodyMatch.index;
        const bodyEndIndex = bodyStartIndex + fullMatch.length;

        const bodyOpenMatch = fullMatch.match(/<body\b[^>]*>/i);
        const bodyOpenTag = bodyOpenMatch ? bodyOpenMatch[0] : "<body>";

        return {
          start: fullHtml.substring(0, bodyStartIndex) + bodyOpenTag + "\n",
          body: bodyInner.trim(),
          end: "\n</body>" + fullHtml.substring(bodyEndIndex)
        };
      }

      return {
        start: "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Document</title>\n</head>\n<body>\n",
        body: fullHtml,
        end: "\n</body>\n</html>"
      };
    }

    async function waitForEditor() {
      return new Promise((resolve) => {
        const check = () => {
          const ed = tinymce.get("editor");
          if (ed) {
            resolve(ed);
          } else {
            setTimeout(check, 50);
          }
        };
        check();
      });
    }

    async function getEditor() {
      return await waitForEditor();
    }

    function normalizeCodeBlocks(root) {
      if (!root) return;

      root.querySelectorAll("pre[class*='language-']").forEach((pre) => {
        if (!pre.querySelector("code")) {
          const cls = pre.className;
          const code = document.createElement("code");
          code.className = cls;
          code.textContent = pre.textContent;
          pre.textContent = "";
          pre.appendChild(code);
        }
      });

      root.querySelectorAll("code[class*='language-']").forEach((code) => {
        const parent = code.parentElement;
        if (!parent || parent.tagName.toLowerCase() !== "pre") {
          const pre = document.createElement("pre");
          pre.className = code.className;
          code.parentNode.insertBefore(pre, code);
          pre.appendChild(code);
        }
      });
    }

    function recolorEditor() {
      const editor = tinymce.get("editor");
      if (!editor || !window.Prism) return;

      const body = editor.getBody();
      if (!body) return;

      normalizeCodeBlocks(body);

      body.querySelectorAll("code[class*='language-']").forEach((el) => {
        Prism.highlightElement(el);
      });
    }

    async function loadBodyHtml(bodyHtml) {
      const editor = await getEditor();
      editor.setContent(bodyHtml || "<p></p>");
      recolorEditor();
      isDirty = false;
      setStatus("Loaded: " + currentFileName);
    }

    async function getBodyHtml() {
      const editor = await getEditor();
      return editor.getContent();
    }

    function normalizeCodeBlocks(root) {
      if (!root) return;
    
      root.querySelectorAll("pre[class*='language-']").forEach((pre) => {
        if (!pre.querySelector("code")) {

        if (!parent || parent.tagName.toLowerCase() !== "pre") {
          const pre = document.createElement("pre");
          pre.className = code.className;
          code.parentNode.insertBefore(pre, code);
          pre.appendChild(code);
        }
      });
    }
    
    async function saveToDownload() {
      function ensureUtf8Meta(docStart) {
        if (!docStart || !docStart.trim()) {
          return "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n</head>\n<body>\n";
        }
    
        // Replace existing charset meta with UTF-8
        if (/<meta\s+charset=/i.test(docStart)) {
          return docStart.replace(
            /<meta\s+charset=["']?[^"'>\s]+["']?\s*\/?>/i,
            '<meta charset="UTF-8">'
          );
        }
    
        // Replace old-style content-type meta with UTF-8
        if (/<meta[^>]+content=["'][^"']*charset=/i.test(docStart)) {
          return docStart.replace(
            /<meta[^>]+content=["'][^"']*charset=[^"']*["']\s*\/?>/i,
            '<meta charset="UTF-8">'
          );
        }
    
        // Insert UTF-8 meta inside existing head
        if (/<head\b[^>]*>/i.test(docStart)) {
          return docStart.replace(
            /<head\b[^>]*>/i,
            match => `${match}\n<meta charset="UTF-8">`
          );
        }
    
        // Fallback if head is missing
        return "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n</head>\n<body>\n";
      }
    
      const bodyHtml = await getBodyHtml();
    
      const temp = document.createElement("div");
      temp.innerHTML = bodyHtml;
    
      // Normalize code blocks before highlighting
      normalizeCodeBlocks(temp);
    
      // Force Prism highlighting into saved HTML
      temp.querySelectorAll("pre[class*='language-'], pre code[class*='language-'], code[class*='language-']").forEach((node) => {
        let pre = null;
        let code = null;
    
        if (node.tagName.toLowerCase() === "pre") {
          pre = node;
          code = pre.querySelector("code");
    
          if (!code) {
            code = document.createElement("code");
            code.className = pre.className;
            code.textContent = pre.textContent || "";
            pre.textContent = "";
            pre.appendChild(code);
          }
        } else if (node.tagName.toLowerCase() === "code") {
          code = node;
          pre = code.parentElement && code.parentElement.tagName.toLowerCase() === "pre"
            ? code.parentElement
            : null;
        }
    
        if (!code) return;
    
        const classText = `${code.className || ""} ${pre ? pre.className || "" : ""}`.trim();
        const match = classText.match(/language-([a-zA-Z0-9_-]+)/);
        if (!match) return;
    
        const lang = match[1];
        const grammar = Prism.languages[lang];
        if (!grammar) return;
    
        code.className = `language-${lang}`;
        if (pre) pre.className = `language-${lang}`;
    
        const rawCode = code.textContent || "";
        code.innerHTML = Prism.highlight(rawCode, grammar, lang);
      });
    
      let docStart = currentDocStart;

      if (/<head\b[^>]*>/i.test(docStart)) {

        );

        docStart =
          "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<style>\n" +
          savedDocumentCss +
          "\n</style>\n</head>\n<body>\n";
      }
      
      docStart = ensureUtf8Meta(currentDocStart);
      
      // Remove ALL existing <style> blocks
      docStart = docStart.replace(/<style[\s\S]*?<\/style>\s*/gi, "");
      
      // Insert our style
      if (/<head\b[^>]*>/i.test(docStart)) {
        docStart = docStart.replace(
          /<head\b[^>]*>/i,

          "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<style>\n" +

          "\n</style>\n</head>\n<body>\n";
      }    

      const fullHtml = docStart + temp.innerHTML + currentDocEnd;
    
      const blob = new Blob([fullHtml], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
    
      const a = document.createElement("a");
      a.href = url;
      a.download = currentFileName || "document.html";
      document.body.appendChild(a);
      a.click();
      a.remove();
    
      URL.revokeObjectURL(url);
    
      isDirty = false;
      setStatus("Saved: " + currentFileName);
    }

      file_picker_callback: function (callback, value, meta) {

          reader.onload = function () {

          reader.onerror = function () {
            alert("Could not read image file.");

          reader.readAsDataURL(file);
        };

        input.click();

      setup: function (editor) {
        function extractTextWithLineBreaks(node) {
          if (!node) return "";

          let result = "";

          function walk(n) {
            if (n.nodeType === Node.TEXT_NODE) {
              result += n.nodeValue || "";
              return;
            }

            if (n.nodeType !== Node.ELEMENT_NODE) return;

            const tag = n.tagName.toLowerCase();

            if (tag === "br") {
              result += "\n";
              return;
            }

            const isBlock =
              tag === "div" ||
              tag === "p" ||
              tag === "pre" ||
              tag === "li" ||
              tag === "tr" ||
              tag === "table" ||
              tag === "section" ||
              tag === "article";

            if (isBlock && result && !result.endsWith("\n")) {
              result += "\n";
            }

            for (const child of n.childNodes) {
              walk(child);
            }

            if (isBlock && !result.endsWith("\n")) {
              result += "\n";
            }
          }

          walk(node);

          return result
            .replace(/\r/g, "")
            .replace(/\n{3,}/g, "\n\n")
            .trim();
        }

        editor.on("init", function () {
          recolorEditor();
          if (editorReadyResolve) editorReadyResolve(editor);
        });

        editor.on("change input undo redo setcontent", function () {
          isDirty = true;
          setStatus("Editing: " + currentFileName + " *");
        });

        editor.on("SetContent", function () {
          recolorEditor();
        });

        editor.on("init", function () {
          recolorEditor();
        });

        editor.on("PastePostProcess", function (e) {
          const text = extractTextWithLineBreaks(e.node);
          if (!text) return;

          const looksLikeCode = false;
/*               text.includes(";")
            || text.includes("{")
            || text.includes("}")
            || text.includes("#include")
            || text.includes("component")
            || text.includes("entity")
            || text.includes("module");
*/
          if (!looksLikeCode) return;

          let lang = "cpp";

          if (text.includes("component") || text.includes("setbits")) {
            lang = "psc";
          } else if (text.toLowerCase().includes("library ieee") || text.toLowerCase().includes("std_logic")) {
            lang = "vhdl";
          } else if (text.includes("module") && text.includes("endmodule")) {
            lang = "verilog";
          }

          const escaped = text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

          e.node.innerHTML =
            `<pre class="language-${lang}"><code class="language-${lang}">${escaped}</code></pre>`;

          setTimeout(() => recolorEditor(), 0);
        });

        editor.on("PastePostProcess", function (e) {
        
          // Do not touch code blocks
          if (e.node.querySelector("pre")) return;
        
          // Replace <br> by paragraph breaks
          e.node.innerHTML = e.node.innerHTML
            .replace(/<br\s*\/?>/gi, "</p><p>");
        
        });
      }
    });

    async function readHtmlFileWithEncoding(file) {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);
    
      // Try to detect charset from the HTML itself
      const asciiHead = new TextDecoder("ascii").decode(bytes.slice(0, 4096));
      let charset = null;
    
      let m = asciiHead.match(/<meta[^>]+charset=["']?\s*([^"'>\s]+)/i);
      if (m) charset = m[1].toLowerCase();
    
      if (!charset) {
        m = asciiHead.match(/<meta[^>]+content=["'][^"']*charset=([^"'>\s;]+)/i);
        if (m) charset = m[1].toLowerCase();
      }
    
      // Normalize a few common names
      if (charset === "utf8") charset = "utf-8";
      if (charset === "ansi") charset = "windows-1252";
      if (charset === "iso-8859-1") charset = "windows-1252";
    
      // Preferred decoding order
      const candidates = charset
        ? [charset, "utf-8", "windows-1252"]
        : ["utf-8", "windows-1252"];
    
      for (const enc of candidates) {
        try {
          return new TextDecoder(enc).decode(bytes);
        } catch (err) {
          // try next
        }
      }
    
      // final fallback
      return new TextDecoder("utf-8").decode(bytes);
    }

    fileInput.addEventListener("change", async function (event) {

      try {

        setStatus("Loaded: " + currentFileName);
        fileInput.value = "";
      } catch (err) {

        alert("Could not open file.");
      }
    });    
    
    function ensureUtf8Meta(docStart) {
      if (/<meta\s+charset=/i.test(docStart)) {
        return docStart.replace(/<meta\s+charset=["'][^"']*["']\s*\/?>/i, '<meta charset="UTF-8">');
      }
    
      if (/<head\b[^>]*>/i.test(docStart)) {
        return docStart.replace(/<head\b[^>]*>/i, match => `${match}\n<meta charset="UTF-8">`);
      }
    
      return "<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n</head>\n<body>\n";
    }
